substitutions:
  name: anenji
  device_description: "Monitor and control a ANENJI 6200W inverter via RS232"
  tx_pin: GPIO16
  rx_pin: GPIO17

esphome:
  name: ${name}
  comment: ${device_description}
  min_version: 2024.6.0
  friendly_name: Anenji

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:
  level: DEBUG
# Enable Home Assistant API
api:
  encryption:
    key: ""

ota:
  - platform: esphome
    password: ""

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Anenji Fallback Hotspot"
    password: ""
web_server:
  port: 80
uart:
  - id: uart_0
    baud_rate: 9600
    tx_pin: ${tx_pin}
    rx_pin: ${rx_pin}
    debug:
      direction: BOTH
      dummy_receiver: false

modbus:
  - id: modbus0
    uart_id: uart_0
    send_wait_time: 200ms
    turnaround_time: 200ms
    
    
modbus_controller:
  - id: smg0
    address: 0x01
    modbus_id: modbus0
#    command_throttle: 200ms
    update_interval: 10s

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Kyiv

select:
  - platform: modbus_controller
    modbus_controller_id: smg0
    id: smg_input_voltage_range
    name: "input voltage range"
    use_write_multiple: true
    address: 302
    value_type: U_WORD
    optionsmap:
      "Apply": 0
      "UPS": 1
      "GEN": 2

#  - platform: modbus_controller
#    modbus_controller_id: smg0
#    id: battery_type_select
#    name: "battery type"
#    use_write_multiple: true
#    address: 322
#    value_type: U_WORD
#    optionsmap:
#      "AGM": 0
#      "FLD": 1
#      "User": 2
#      #"Li_1": 3
#      "Li_2": 4
#      #"Li_3": 5
#     "Li_4": 6

  # Output priority                                               Uint  301 1 R/W 0: Utility-PV-Battery, 1: PV-Utility-Battery, 2: PV-Battery-Utility
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "output priority"
    id: smg_output_priority
    use_write_multiple: true
    address: 301
    value_type: U_WORD
    optionsmap:
      "UTI": 0
      "SOL": 1
      "SBU": 2
      "SUB": 3
      "SUF": 4

  # Battery charging priority                                     Uint  331 1 R/W 0: Utility priority, 1: PV priority, 2: PV is at the same level as the Utility, 3: Only PV charging is allowed
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "battery charging priority"
    use_write_multiple: true
    address: 331
    value_type: U_WORD
    optionsmap:
      #"Utility priority": 0
      "PV priority": 1
      "PV is at the same level as the Utility": 2
      "Only PV charging is allowed": 3

  # Turn on mode                                                  Uint  406 1 R/W 0: Can be turn-on locally or remotely, 1: Only local turn-on, 2: Only remote turn-on
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "turn on mode"
    use_write_multiple: true
    address: 406
    value_type: U_WORD
    optionsmap:
      "Local and remotely turn-on allowed": 0
      "Local turn-on only": 1
      "Remote turn-on only": 2



